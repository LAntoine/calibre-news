[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibre-news-engine"
version = "0.1.0"
description = "Portable engine that runs calibre news recipes and produces EPUB files (Android/desktop)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
images = ["Pillow>=10.0"]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live network test against a real recipe (run by default, needs internet)",
]
